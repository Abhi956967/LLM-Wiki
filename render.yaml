services:
  - type: web
    name: llmwiki-mcp-server
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r mcp/requirements.txt pypdf"
    startCommand: "python -m uvicorn hosted:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: mcp
      - key: MODE
        value: hosted
      - key: STAGE
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: MCP_URL
        sync: false
